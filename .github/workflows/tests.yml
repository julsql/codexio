name: Tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres_test:
        image: postgres:15
        ports:
          - 5452:5432
        env:
          POSTGRES_USER: codexio
          POSTGRES_PASSWORD: codexio
          POSTGRES_DB: codexio
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: dummy-test-secret-key
      DEBUG: false
      GSHEET_CREDENTIALS: config/codexio.json
      GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
      DJANGO_ENV: test
      POSTGRES_USER: codexio
      POSTGRES_PASSWORD: codexio
      POSTGRES_DB: codexio
      EMAIL_HOST_USER: test@example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create service account key from secret
        run: echo '${{ secrets.SERVICE_ACCOUNT_CONFIG }}' > src/config/codexio.json

      - name: Wait for PostgreSQL to be ready
        run: |
          until pg_isready -h localhost -p 5452; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run init.sql manually
        run: |
          PGPASSWORD=$POSTGRES_PASSWORD psql -h localhost -p 5452 -U $POSTGRES_USER -d $POSTGRES_DB -f src/database/init.sql

      - name: Run tests
        run: |
          cd src
          python manage.py migrate
          python manage.py test
